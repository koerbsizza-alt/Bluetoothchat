name: Build Bluetooth Chat APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir project
          unzip -q BluetoothChat_PhoneOnly.zip -d project
          echo "Contents:"
          find project -maxdepth 3 -type f | head -50

      - name: Find project folder
        run: |
          if [ -f project/BluetoothChat/settings.gradle ]; then
            echo "PROJECT_DIR=project/BluetoothChat" >> $GITHUB_ENV
          else
            echo "PROJECT_DIR=project" >> $GITHUB_ENV
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothChat-debug-APK
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
